<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Nền Dark Navy Gradient Sâu Thẳm -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Viền Neon Sáng Rực -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="75%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Nhánh Trái Chữ V (Cyan -> Electric Blue) -->
    <linearGradient id="vLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Nhánh Phải Chữ V (Pink -> Rose -> Neon Magenta) -->
    <linearGradient id="vRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Đỉnh Chữ V (Highlight 3D) -->
    <linearGradient id="vCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Vòng Vô Cực Toán Học (Emerald & Gold) -->
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="45%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Quầng Phát Sáng Trung Tâm -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Nền App Icon Squircle Bo Góc Tuyệt Đẹp (Chuẩn iOS 120px corner radius) -->
  <rect x="20" y="20" width="472" height="472" rx="105" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="105" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- 2. Quầng Hào Quang Tỏa Sáng Nền -->
  <circle cx="256" cy="230" r="190" fill="url(#centerGlow)" />

  <!-- 3. Ký Tự Toán Học Nghệ Thuật Ẩn Hiện -->
  <g fill="#38BDF8" opacity="0.22" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900">
    <text x="60" y="125" font-size="44">π</text>
    <text x="420" y="125" font-size="44">∫</text>
    <text x="60" y="375" font-size="40">∑</text>
    <text x="415" y="375" font-size="40">Δ</text>
    <text x="235" y="80" font-size="34">√x</text>
  </g>

  <!-- 4. Vòng Vô Cực Toán Học (Infinity Symbol) - Lớp Dày Nổi Rõ -->
  <!-- Quầng phát quang -->
  <path
    d="M 155 220 C 155 150, 225 150, 256 220 C 287 290, 357 290, 357 220 C 357 150, 287 150, 256 220 C 225 290, 155 290, 155 220 Z"
    fill="none"
    stroke="#10B981"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.3"
  />
  <!-- Nét rực rỡ chính của Infinity -->
  <path
    d="M 155 220 C 155 150, 225 150, 256 220 C 287 290, 357 290, 357 220 C 357 150, 287 150, 256 220 C 225 290, 155 290, 155 220 Z"
    fill="none"
    stroke="url(#infGrad)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 5. CHỮ 'V' KHỐI 3D RỰC RỠ (SOLID 3D FILLED POLYGONS) - ĐẢM BẢO 100% ĐỘ TƯƠNG PHẢN -->
  <!-- Quầng phát sáng rực rỡ của chữ V -->
  <polyline
    points="110,115 256,365 402,115"
    fill="none"
    stroke="#38BDF8"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.25"
  />

  <!-- Nhánh Trái Chữ V (Khối Đa Giác Dày 3D Vuốt Nhọn) -->
  <polygon
    points="90,120 145,110 256,365 226,370"
    fill="url(#vLeftGrad)"
  />
  <line x1="90" y1="120" x2="256" y2="365" stroke="#E0F2FE" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Nhánh Phải Chữ V (Khối Đa Giác Dày 3D Vuốt Nhọn) -->
  <polygon
    points="422,120 367,110 256,365 286,370"
    fill="url(#vRightGrad)"
  />
  <line x1="422" y1="120" x2="256" y2="365" stroke="#FFE4E6" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Tâm Giao Đáy Chữ V (Khối Trụ Kết Nối Mềm Mại) -->
  <circle cx="256" cy="365" r="24" fill="url(#vCenterGrad)" />

  <!-- Nét Đồ Họa Cực Đại Đè Lên Tạo Độ Bóng Kính Sắc Nét -->
  <polyline
    points="115,115 256,360 397,115"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />

  <!-- 6. Ngôi Sao Hoàng Kim Rực Rỡ Ở Đỉnh (Golden Diamond Star) -->
  <g transform="translate(398, 115)">
    <circle cx="0" cy="0" r="32" fill="#F59E0B" opacity="0.4" />
    <circle cx="0" cy="0" r="18" fill="#FBBF24" opacity="0.9" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
    <!-- 4 cánh sao nhọn -->
    <path d="M 0 -26 L 5 -6 L 26 0 L 5 6 L 0 26 L -5 6 L -26 0 L -5 -6 Z" fill="#FFFBEB" />
  </g>

  <!-- 7. Chữ Thương Hiệu VINAMATH 2026 Siêu Nổi Bật -->
  <g id="brandText">
    <!-- Bóng chữ đen đổ bóng mạnh mẽ -->
    <text x="256" y="438" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="3" fill="#000000" opacity="0.9">
      VINAMATH
    </text>
    <!-- Chữ chính 2 tông màu VINA trắng tuyết + MATH xanh ngọc điện -->
    <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="3">
      <tspan fill="#FFFFFF">VINA</tspan><tspan fill="#38BDF8">MATH</tspan>
    </text>
    <!-- Huy hiệu vàng gold 2026 -->
    <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#FBBF24" letter-spacing="5">
      2026 • GDPT KNTT
    </text>
  </g>

  <!-- 8. Lớp Ánh Kính Phản Chiếu Thượng Hạng Góc Trên -->
  <path
    d="M 20 125 C 20 67, 67 20, 125 20 L 387 20 C 445 20, 492 67, 492 125 C 492 170, 415 210, 256 210 C 97 210, 20 170, 20 125 Z"
    fill="#FFFFFF"
    opacity="0.08"
  />
</svg>